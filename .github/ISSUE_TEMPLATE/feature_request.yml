name: Feature request
description: 建议新的工作流、算法、模板或验证能力
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流的限制或具体使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明输入、输出、预期流程和验收标准。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 参考资料
      description: 如涉及论文、Kaggle、算法或外部代码，请提供来源与许可证。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同建议
          required: true
